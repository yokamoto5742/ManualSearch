[project]
name = "manualsearch"
version = "1.4.0"
requires-python = ">=3.12"

dependencies = [
    "PyQt5>=5.15.11",
    "PyMuPDF>=1.26.3",
    "PyPDF2>=3.0.1",
    "PyAutoGUI>=0.9.54",
    "pillow>=11.3.0",
    "psutil>=7.0.0",
    "pyyaml>=6.0.2",
    "markdown>=3.8.2",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "pytest-qt>=4.5.0",
    "coverage>=7.9.2",
    "pyinstaller>=6.14.2",
    "pip-review>=1.3.0",
]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["app", "service", "utils", "widgets"]
exclude = ["tests", "scripts"]
reportMissingTypeStubs = false
reportUnusedVariables = true
reportUnusedImports = true

[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = ["tests"]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
    "memory: marks tests as memory usage tests",
    "large_dataset: marks tests requiring large datasets",
    "network: marks tests requiring network access",
    "gui: marks tests requiring GUI components",
    "timeout: marks tests with custom timeout values",
]

filterwarnings = [
    "ignore::DeprecationWarning:.*_bootstrap.*",
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type.*has no __module__ attribute:DeprecationWarning",
    "ignore::DeprecationWarning:.*SwigPy.*",
    "ignore::DeprecationWarning:.*swigvarlink.*",
    "ignore::DeprecationWarning:.*fitz.*",
    "ignore::DeprecationWarning:.*psutil.*",
    "ignore::ResourceWarning:.*tempfile.*",
]

addopts = "--tb=short --strict-markers --disable-warnings --maxfail=5 --durations=5 --cov-config=.coveragerc"
timeout = 300
console_output_style = "progress"
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
